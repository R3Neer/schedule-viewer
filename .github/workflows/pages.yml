name: Deploy GitHub Pages

on:
  push:
    branches: [main, v3-config-engine, local-config-ui]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install JavaScript test dependencies
        run: npm install --no-audit --no-fund

      - name: Enforce YAML as the only source configuration
        run: |
          test -f config/schedule.yaml
          test ! -e config/schedules.json
          test -z "$(find config -maxdepth 1 -type f -name '*.json' -print -quit)"

      - name: Validate and compile YAML v3 demo
        run: |
          python tools/validate_config.py
          python tools/compile_config.py --out test-output/schedule.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("test-output/schedule.json").read_text(encoding="utf-8"))
          source = Path("config/schedule.yaml").read_text(encoding="utf-8")
          assert data["version"] == 3
          assert data["calendar"]["inactive"]["defaultImage"]["src"]
          assert data["desktop"]["defaultView"] in data["views"]
          assert "UCM" not in source
          assert "Samuel" not in source
          assert "Aula 9" not in source
          print("compiled neutral demo contract: OK")
          PY

      - name: Test YAML compiler and negative validation contracts
        run: python tests/config-v3.test.py

      - name: Test calendar, persistence, package, renderer and Service Worker contracts
        run: npm test

      - name: Build exact static artifact
        run: python tools/build.py --out dist

      - name: Assert build artifact and lazy boundaries
        run: |
          test -f dist/config/schedule.json
          test ! -e dist/config/schedule.yaml
          test -f dist/lazy/config-io.js
          test -f dist/lazy/yaml-editor.js
          grep -q 'codemirror' dist/lazy/yaml-editor.js
          ! grep -qi 'codemirror' dist/app.js
          ! grep -qi 'codemirror' dist/settings-ui.js
          ! grep -q 'lazy/yaml-editor.js' dist/service-worker.js
          ! grep -q 'lazy/config-io.js' dist/service-worker.js
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("dist/config/schedule.json").read_text(encoding="utf-8"))
          assert config["version"] == 3
          assert len(config["views"]) >= 4
          assert config["calendar"]["inactive"]["defaultImage"]["type"] == "image"
          print("dist + lazy boundaries: OK")
          PY

      - name: Verify generated WebP assets are real visual renders, not blank placeholders
        run: python tests/generated-assets.test.py dist

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Open built web app and run demanding E2E + offline tests
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
