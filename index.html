<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F7FB">
  <meta name="color-scheme" content="light">
  <title>Schedule Viewer</title>
  <link rel="stylesheet" href="./styles.css?v=20260903-v3">
  <script type="importmap">
    {
      "imports": {
        "./schedule-core.js": "./schedule-core.js?v=20260903-v3",
        "./date-core.js": "./date-core.js?v=20260903-v3",
        "./range-core.js": "./range-core.js?v=20260903-v3",
        "./view-core.js": "./view-core.js?v=20260903-v3",
        "./calendar-core.js": "./calendar-core.js?v=20260903-v3",
        "./content-core.js": "./content-core.js?v=20260903-v3",
        "./content-renderer.js": "./content-renderer.js?v=20260903-v3"
      }
    }
  </script>
</head>
<body>
  <main class="schedule-shell">
    <img id="schedule-image" class="schedule-image" alt="Schedule Viewer" decoding="async">
    <p id="error-message" class="error-message" role="alert" hidden></p>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          await navigator.serviceWorker.register("./service-worker.js", {
            scope: "./",
            updateViaCache: "none"
          });
          await navigator.serviceWorker.ready;
          document.documentElement.dataset.offlineReady = "1";
        } catch (error) {
          console.error("No se pudo activar el modo offline.", error);
          document.documentElement.dataset.offlineReady = "0";
        }
      });
    }
  </script>
  <script type="module" src="./app.js?v=20260903-v3"></script>
</body>
</html>
