version: 4

app:
  timezone: Europe/Madrid

defaults:
  week_starts_on: monday
  image_fit: contain

runtime:
  allow_date_override: true
  demo: true

presentation:
  vertical:
    unit: day
  desktop_toggle: true

calendar:
  active_weekdays: [monday, tuesday, wednesday, thursday, friday]
  exceptions:
    - id: autumn-holiday
      date: '2026-10-12'
      name: Public holiday
      state: inactive
      kind: holiday
    - id: maintenance-day
      date: '2026-11-13'
      name: Maintenance closure
      state: inactive
      kind: closure
  inactive_periods:
    - id: winter-break
      name: Winter break
      start: '2026-12-19'
      end: '2027-01-10'
      kind: vacation
    - id: spring-break
      name: Spring break
      start: '2027-03-22'
      end: '2027-03-28'
      kind: vacation

periods:
  - id: demo-autumn
    name: Autumn period
    start: '2026-09-01'
    end: '2026-12-18'
    images:
      active:
        vertical:
          default: assets/demo/autumn/day-monday-vertical.webp
          days:
            monday: assets/demo/autumn/day-monday-vertical.webp
            tuesday: assets/demo/autumn/day-tuesday-vertical.webp
            wednesday: assets/demo/autumn/day-wednesday-vertical.webp
            thursday: assets/demo/autumn/day-thursday-vertical.webp
            friday: assets/demo/autumn/day-friday-vertical.webp
        horizontal: assets/demo/autumn/horizontal.webp
      inactive:
        vertical:
          src: assets/states/inactive-vertical.webp
          alt: No activities today
        horizontal:
          src: assets/states/inactive-horizontal.webp
          alt: Inactive period

  - id: demo-spring
    name: Spring period
    start: '2027-01-11'
    end: '2027-05-14'
    images:
      active:
        vertical:
          default: assets/demo/spring/day-monday-vertical.webp
          days:
            monday: assets/demo/spring/day-monday-vertical.webp
            tuesday: assets/demo/spring/day-tuesday-vertical.webp
            wednesday: assets/demo/spring/day-wednesday-vertical.webp
            thursday: assets/demo/spring/day-thursday-vertical.webp
            friday: assets/demo/spring/day-friday-vertical.webp
        horizontal: assets/demo/spring/horizontal.webp
      inactive:
        vertical:
          src: assets/states/inactive-vertical.webp
          alt: No activities today
        horizontal:
          src: assets/states/inactive-horizontal.webp
          alt: Inactive period
