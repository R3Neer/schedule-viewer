version: 3
app:
  title: Schedule Viewer
  timezone: Europe/Madrid
defaults:
  week_starts_on: monday
  image_fit: contain
runtime:
  allow_date_override: true
visual:
  brand: UCM · FdI
  title: Ingeniería Informática
  palette:
    background: '#F4F7FB'
    paper: '#FFFFFF'
    ink: '#102A43'
    muted: '#627D98'
    line: '#D9E2EC'
    navy: '#173F68'
    navySoft: '#EAF2FA'
states:
  inactive_default: assets/states/no-class-today-vertical.webp
  vacations: assets/states/vacations-horizontal.webp
calendar:
  inactive:
    default_image:
      src: assets/states/no-class-today-vertical.webp
      alt: Sin clases hoy
      fit: contain
  inactive_weekdays:
  - saturday
  - sunday
  active_dates: []
  inactive_dates: []
views:
  phone_portrait:
    priority: 100
    when:
      orientation: portrait
      max_width: 760
    range: day
    renderer:
      type: timetable
      artwork: phone
  phone_landscape:
    priority: 100
    when:
      orientation: landscape
      max_width: 950
      max_height: 520
    range:
      type: week
      starts_on: monday
    renderer:
      type: timetable
      artwork: phone
  wide_default:
    priority: 10
    when:
      min_width: 761
    range:
      type: week
      starts_on: monday
    renderer:
      type: timetable
      artwork: asset
  desktop_portrait:
    manual_only: true
    range: day
    renderer:
      type: timetable
      artwork: asset
desktop:
  when:
    min_width: 1000
  primary_view: wide_default
  secondary_view: desktop_portrait
  default_view: wide_default
  shortcuts:
    toggle_view:
      key: Space
