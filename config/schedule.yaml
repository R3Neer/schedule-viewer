rules:
- priority: 400
  when:
    date_range:
      start: '2027-01-18'
      end: '2027-01-24'
    view:
    - phone_landscape
    - wide_default
  content:
    type: term-schedule
    academic_year: 2026-2027
    term: q2
    range: week
- priority: 300
  when:
    calendar_status: vacation
    view:
    - phone_landscape
    - wide_default
  content:
    type: image
    src: assets/states/vacations-horizontal.webp
    alt: Vacaciones
    fit: contain
- priority: 250
  when:
    calendar_status:
    - holiday
    - non-teaching
    - inactive-weekday
    view:
    - phone_landscape
    - wide_default
  content:
    type: current-term-schedule
- priority: 200
  when:
    calendar_status: out-of-term
    view:
    - phone_landscape
    - wide_default
  content:
    type: next-term-schedule
- priority: 100
  when:
    calendar_status:
    - holiday
    - non-teaching
    - inactive-weekday
    - vacation
    - out-of-term
    view:
    - phone_portrait
    - desktop_portrait
  content:
    type: inactive-image
